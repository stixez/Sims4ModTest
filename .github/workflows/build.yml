name: Build

# Every push and pull request: tests on Windows, macOS and Linux, and a build of the app for each.
# A tag like v1.1.0 also publishes a release with the Windows installer, a portable Windows zip,
# the macOS app (Apple silicon) and a Linux archive.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen

# Actions are pinned to full commit SHAs, so a moved tag can't change what builds the app.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]  # 22.04: an older glibc runs on more distributions
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - name: Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --version 6.7.1 --no-progress -y
      - run: python -m pip install -r requirements.txt
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(python -c "from version import __version__; print(__version__)")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "Tag ${GITHUB_REF_NAME} but version.py says ${version}"; exit 1; }
      - run: python -m pytest -q tests
      - run: python packaging/build.py
      - name: The built app starts
        shell: bash
        env:
          SIMS4MODTEST_SMOKE_TEST: "1"
        run: |
          case "$RUNNER_OS" in
            Windows) app="dist/Sims 4 Mod Test/Sims 4 Mod Test.exe" ;;
            macOS)   app="dist/Sims 4 Mod Test.app/Contents/MacOS/Sims 4 Mod Test" ;;
            *)       app="dist/Sims 4 Mod Test/Sims 4 Mod Test" ;;
          esac
          "$app" &
          pid=$!
          for _ in $(seq 60); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then kill "$pid"; echo "The app didn't quit"; exit 1; fi
          wait "$pid"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ runner.os }}
          path: |
            dist/Sims-4-Mod-Test-*-setup.exe
            dist/Sims-4-Mod-Test-*.zip
            dist/Sims-4-Mod-Test-*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
          generate_release_notes: true
